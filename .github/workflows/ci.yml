name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.compiler }} ${{ matrix.build_type }}${{ matrix.sanitizers == 'ON' && ' asan+ubsan' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cxx: g++-13
            cc: gcc-13
            build_type: Debug
            sanitizers: OFF
          - compiler: gcc-13
            cxx: g++-13
            cc: gcc-13
            build_type: Release
            sanitizers: OFF
          - compiler: clang-17
            cxx: clang++-17
            cc: clang-17
            build_type: Debug
            sanitizers: ON
          - compiler: clang-17
            cxx: clang++-17
            cc: clang-17
            build_type: Release
            sanitizers: OFF

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 clang-17

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DPIDPP_BUILD_TESTS=ON
          -DPIDPP_BUILD_EXAMPLES=ON
          -DPIDPP_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test (unit tests and example scenarios)
        run: ctest --test-dir build --output-on-failure --parallel 4

  windows:
    name: windows msvc ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64 -DPIDPP_BUILD_TESTS=ON -DPIDPP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --parallel 4

  macos:
    name: macos appleclang Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPIDPP_BUILD_TESTS=ON -DPIDPP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  install:
    name: install and consume package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build and install SDK
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPIDPP_BUILD_TESTS=OFF -DPIDPP_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/install"

      - name: Build consumer with find_package
        run: |
          cmake -S examples/cmake_consumer_example -B consumer -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer --parallel
          ./consumer/pidpp_consumer

      - name: Check pkg-config metadata
        run: PKG_CONFIG_PATH="$PWD/install/lib/pkgconfig" pkg-config --modversion pidpp

  gui:
    name: control lab GUI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPIDPP_BUILD_GUI=ON -DPIDPP_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel --target pidpp_control_lab

      - name: Headless smoke test
        run: ./build/tools/gui/pidpp_control_lab --headless

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPIDPP_BUILD_BENCHMARKS=ON \
            -DPIDPP_BUILD_TESTS=OFF -DPIDPP_BUILD_EXAMPLES=OFF
          cmake --build build --parallel --target pidpp_update_benchmark

      - name: Run
        run: ./build/benchmarks/pidpp_update_benchmark --benchmark_min_time=0.05s

  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format 17
        run: pip install clang-format==17.0.6

      - name: Check formatting
        run: |
          find include src tests examples benchmarks tools \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 clang-tidy-17

      - name: Configure compile database
        run: >
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_CXX_COMPILER=clang++-17
          -DPIDPP_BUILD_TESTS=OFF -DPIDPP_BUILD_EXAMPLES=OFF

      - name: Run clang-tidy on the library
        run: clang-tidy-17 -p build src/version.cpp

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate API docs
        run: |
          cmake -S . -B build -DPIDPP_BUILD_DOCS=ON -DPIDPP_BUILD_TESTS=OFF -DPIDPP_BUILD_EXAMPLES=OFF
          cmake --build build --target pidpp_docs

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build/docs/html
